<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Infoduction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--primary-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-color);
        }

        /* Animated Background Shapes */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            z-index: -1;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* Main Card */
        .container {
            width: 90%;
            max-width: 800px;
            padding: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 12px 35px;
            background: #fff;
            color: #764ba2;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: #764ba2;
            color: #fff;
            transform: scale(1.05);
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .container { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="circle" style="width: 80px; height: 80px; left: 10%; bottom: -100px;"></div>
    <div class="circle" style="width: 150px; height: 150px; left: 70%; bottom: -200px; animation-delay: 5s;"></div>
    <div class="circle" style="width: 50px; height: 50px; left: 40%; bottom: -150px; animation-delay: 2s;"></div>

    <div class="container animate__animated animate__fadeInUp">
        <h1 class="animate__animated animate__lightSpeedInLeft">Hello!</h1>
        <p class="animate__animated animate__fadeIn animate__delay-1s">
            Welcome to <strong>Infoduction</strong>. This is a place where information meets 
            elegant design. We specialize in turning complex data into beautiful, 
            interactive experiences.
        </p>
        <a href="file:///C:/Users/ASHWANI/Desktop/VS%20Code/A5.html" class="btn animate__animated animate__pulse animate__infinite">Get Started</a>
    </div>

</body>
</html>
